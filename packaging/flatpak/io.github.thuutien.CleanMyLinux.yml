# Flatpak manifest. Build with ./packaging/build-flatpak.sh
# The sandboxed GUI runs apt, flatpak, ps and the pkexec root helper on the
# host through flatpak-spawn, so the host needs polkit and Python 3 (as with
# every other CleanMyLinux package).
app-id: io.github.thuutien.CleanMyLinux
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: cleanmylinux
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Scanning caches, Trash, large and duplicate files across the real filesystem.
  - --filesystem=host
  # flatpak-spawn --host for apt, flatpak, ps and pkexec.
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: python3-psutil
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links=file://${PWD}
        --prefix=${FLATPAK_DEST} psutil --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/2a/80/336820c1ad9286a4ded7e845b2eccfcb27851ab8ac6abece774a6ff4d3de/psutil-7.0.0.tar.gz
        sha256: 7be9c3eba38beccb6495ea33afd982a44074b78f28c434a1f51cc07fd315c456

  - name: cleanmylinux
    buildsystem: simple
    build-commands:
      - install -d /app/lib/cleanmylinux
      - cp -r cleanmylinux /app/lib/cleanmylinux/
      - find /app/lib/cleanmylinux -name __pycache__ -prune -exec rm -rf {} +
      - sed 's|/usr/lib/cleanmylinux|/app/lib/cleanmylinux|' data/cleanmylinux-launcher > cleanmylinux-launcher
      - install -Dm755 cleanmylinux-launcher /app/bin/cleanmylinux
      - install -Dm644 data/cleanmylinux.desktop /app/share/applications/io.github.thuutien.CleanMyLinux.desktop
      - desktop-file-edit --set-icon=io.github.thuutien.CleanMyLinux /app/share/applications/io.github.thuutien.CleanMyLinux.desktop
      - install -Dm644 cleanmylinux/data/cleanmylinux.svg /app/share/icons/hicolor/scalable/apps/io.github.thuutien.CleanMyLinux.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - dist
          - docs
